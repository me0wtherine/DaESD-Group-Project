services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./BRFoodNetwork:/app
    command: sh -c "python manage.py migrate && python manage.py seed_demo && python manage.py runserver 0.0.0.0:8000"
    environment:
      DB_NAME: mydb
      DB_USER: user
      DB_PASSWORD: password
      DB_HOST: db
      DB_PORT: 5432
      # Stripe publishable key stays here – it is safe to expose to the browser
      STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
      # Google Maps key stays here – Django injects it into the producers.html template
      GOOGLE_MAPS_API_KEY: "AIzaSyCMQ1FS49cotdaDuQH5QEchFlMZh9buHZE"
      # Point the web container at the API gateway for server-side external calls
      API_GATEWAY_URL: "http://api:8001"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy

  api:
    build: ./api_gateway
    ports:
      - "8001:8001"
    environment:
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      GOOGLE_MAPS_API_KEY: "AIzaSyCMQ1FS49cotdaDuQH5QEchFlMZh9buHZE"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 10s
      retries: 5

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mydb"]
      interval: 5s
      retries: 5

volumes:
  postgres_data: